[workspace]
resolver = "2"
members = [
    "crates/oxyde-codec",
    "crates/oxyde-sql",
    "crates/oxyde-driver",
    "crates/oxyde-migrate",
    "crates/oxyde-core-py",
]

[workspace.package]
version = "0.6.2"
edition = "2021"
rust-version = "1.75"
license = "MIT"
repository = "https://github.com/mr-fatalyst/oxyde"
homepage = "https://github.com/mr-fatalyst/oxyde"
description = "High-performance async ORM with Rust core"

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.0", features = ["full"] }
anyhow = "1.0"
thiserror = "1.0"
tracing = "0.1"

[workspace.lints.rust]
unsafe_code = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
# nursery is explicitly experimental — too many false positives to gate on
nursery = { level = "allow", priority = -1 }
# Doc-prose lints: not worth gating commits on
doc_markdown = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
# Style calls this codebase makes deliberately: explicit per-kind match
# matrices and long match dispatchers read better than merged arms here.
match_same_arms = "allow"
too_many_lines = "allow"
implicit_hasher = "allow"
struct_excessive_bools = "allow"
